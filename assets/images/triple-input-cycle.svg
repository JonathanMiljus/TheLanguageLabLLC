<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="ticTitle ticDesc">
  <title id="ticTitle">The Triple Input Cycle</title>
  <desc id="ticDesc">A pedagogical framework: learners move from Perception (comprehensible input) through Interaction (scaffolded meaning-making) to Autonomy (independent production), with each stage feeding the next in a continuous cycle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a9e9e"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#2a3d5e"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a9e9e"/>
      <stop offset="100%" stop-color="#2d7a7a"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a03c"/>
      <stop offset="100%" stop-color="#b8892e"/>
    </linearGradient>
  </defs>

  <!-- Connecting arcs -->
  <path d="M 215 130 Q 360 70 505 130" stroke="#3a9e9e" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M 525 200 Q 600 290 470 340" stroke="#3a9e9e" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M 250 340 Q 120 290 195 200" stroke="#3a9e9e" stroke-width="2.5" fill="none" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Stage 1 — Perception -->
  <g>
    <circle cx="160" cy="170" r="80" fill="url(#g1)"/>
    <text x="160" y="155" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-weight="600" fill="#fff">Perception</text>
    <text x="160" y="180" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Stage 1</text>
    <text x="160" y="200" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Comprehensible input</text>
  </g>

  <!-- Stage 2 — Interaction -->
  <g>
    <circle cx="560" cy="170" r="80" fill="url(#g2)"/>
    <text x="560" y="155" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-weight="600" fill="#fff">Interaction</text>
    <text x="560" y="180" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="11" fill="rgba(255,255,255,0.85)">Stage 2</text>
    <text x="560" y="200" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)">Scaffolded meaning-making</text>
  </g>

  <!-- Stage 3 — Autonomy -->
  <g>
    <circle cx="360" cy="340" r="80" fill="url(#g3)"/>
    <text x="360" y="325" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="22" font-weight="600" fill="#1a2744">Autonomy</text>
    <text x="360" y="350" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="11" fill="rgba(26,39,68,0.85)">Stage 3</text>
    <text x="360" y="370" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="11" fill="rgba(26,39,68,0.7)">Independent production</text>
  </g>

  <!-- Caption -->
  <text x="360" y="30" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="12" fill="#6b6760" letter-spacing="0.15em">THE TRIPLE INPUT CYCLE</text>
  <text x="360" y="395" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="11" fill="#9a9690" font-style="italic">Original framework by Jonathan Michael Miljus · The Language Laboratory LLC</text>
</svg>
